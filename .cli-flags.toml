[help]
url = "https://github.com/fanwaave/fanwaave-cli"

[env]
load = false

[parse]
allow_unknown = false

[flags.api-base]
env = "FANWAAVE_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL. Fanwaave runtime default comes from .fanwaave-cfg.toml."

[flags.json]
env = "FANWAAVE_JSON"
aliases = ["json"]
type = "bool"
help = "Emit JSON."

[commands.health]
help = "Check API health."

[commands.status]
help = "Show service status."

[flags.env-map-probe]
env = "ENV_MAP_PROBE"
aliases = ["env-map-probe"]
type = "string"
help = "Runtime environment key ENV_MAP_PROBE."
