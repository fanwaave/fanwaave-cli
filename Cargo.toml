    [package]
    name = "fanwaave-cli"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "CLI for Fanwaave"
    repository = "https://github.com/fanwaave/fanwaave-cli"

    [[bin]]
    name = "fanwaave"
    path = "src/main.rs"

    [dependencies]
    fanwaave-lib-core = { git = "https://github.com/fanwaave/fanwaave-lib-core.git", rev = "b7b0c79bf6c5c71a5508c12f25503ad001a1265e" }
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"
    flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "b708a041531a830bd49f030250836896096e7abd" }

[lints.rust]
unsafe_code = "forbid"


