    [package]
    name = "fanwaave-cli"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "CLI for Fanwaave"
    repository = "https://github.com/fanwaave/fanwaave-cli"

    [[bin]]
    name = "fanwaave"
    path = "src/main.rs"

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


