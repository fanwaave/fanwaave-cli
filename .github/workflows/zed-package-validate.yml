name: zed package validation

on:
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/zed-package-validate.yml"
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".github/workflows/zed-package-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: fc11aeb2bfdfb9be42ec114be6348fbea4951ad0
          path: .zed-cli-validator
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Validate canonical manifest and required lock offline
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path .zed-cli-validator/Cargo.toml --bin zed -- \
            validate \
            --manifest "$GITHUB_WORKSPACE/.zpkg.toml" \
            --lock "$GITHUB_WORKSPACE/.zpkg.lock" \
            --require-lock
